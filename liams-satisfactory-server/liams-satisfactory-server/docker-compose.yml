# Liam's Satisfactory dedicated server.
# Start it with:  docker compose up -d --build
# Stop it with:   docker compose down
# Watch it boot:  docker compose logs -f

services:
  satisfactory:
    build: .
    image: liam-satisfactory-server:latest
    container_name: satisfactory
    hostname: satisfactory-server
    restart: unless-stopped
    environment:
      - MAXPLAYERS=4
      - PGID=1000
      - PUID=1000
      - STEAMBETA=false
    ports:
      # Fixed ports, TCP and UDP on the same numbers (the game needs this)
      - "7777:7777/udp"       # game traffic
      - "7777:7777/tcp"       # server API / Server Manager
      - "15000:15000/udp"     # beacon port
      - "15777:15777/udp"     # query port
    volumes:
      # Reuses the SAME Docker volume as the old "mine" container,
      # so your claimed server and world carry over.
      - satisfactory:/config

volumes:
  satisfactory:
    external: true
